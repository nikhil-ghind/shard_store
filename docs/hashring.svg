<animate attributeName="stroke-opacity" values="0.25;0.25;1;1" keyTimes="0;0.14;0.16;1" dur="14s" repeatCount="indefinite"/>
</rect>
<text x="558" y="160" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#4c9be8">node-1</text>
<text x="650" y="152" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">PUT /store/bucket/key</text>
<text x="650" y="168" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">replica 1</text>
</g>
<g>
<rect x="540" y="200" width="300" height="48" rx="8" fill="none" stroke="#e8a33d" stroke-width="2">
