<text x="250" y="299" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">clockwise &#8594;</text>
<text x="540" y="104" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#8b949e">replica set (replication factor 3)</text>
<g>
