</g>
<text x="558" y="265" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9534f">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.52;0.92;1" dur="14s" repeatCount="indefinite"/>
no heartbeat for 15s &#8594; marked dead, stays on the ring</text>
<text x="558" y="348" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#b07cd8">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.92;1" dur="14s" repeatCount="indefinite"/>
rebalancer: copy from a live replica to the next healthy node</text>
